<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broforce - Working Version</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        #game-container {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

    <!-- All game code inline for debugging -->
    <script>
        console.log('Starting Broforce game...');

        // Global game state
        window.gameState = {
            score: 0,
            lives: 3,
            currentLevel: 1
        };

        // Simple Player class
        class Player {
            constructor(scene, x, y) {
                this.scene = scene;
                this.sprite = scene.add.rectangle(x, y, 24, 32, 0x0000FF);
                scene.physics.add.existing(this.sprite);
                this.sprite.body.setCollideWorldBounds(true);

                this.health = 100;
                this.maxHealth = 100;
                this.speed = 200;
                this.jumpPower = -400;
                this.facing = 1;
                this.grenadeCount = 5;
                this.fireRate = 200;
                this.lastFired = 0;
                this.jumpsLeft = 2;
                this.maxJumps = 2;

                this.cursors = scene.input.keyboard.createCursorKeys();
                this.keys = {
                    W: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.W),
                    A: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.A),
                    S: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.S),
                    D: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.D),
                    K: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.K),
                    L: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.L),
                    SPACE: scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE)
                };

                scene.input.on('pointerdown', (pointer) => {
                    if (pointer.leftButtonDown()) this.shoot();
                });
            }

            update() {
                const onGround = this.sprite.body.blocked.down || this.sprite.body.touching.down;

                // Movement
                if (this.cursors.left.isDown || this.keys.A.isDown) {
                    this.sprite.body.setVelocityX(-this.speed);
                    this.facing = -1;
                } else if (this.cursors.right.isDown || this.keys.D.isDown) {
                    this.sprite.body.setVelocityX(this.speed);
                    this.facing = 1;
                } else {
                    this.sprite.body.setVelocityX(this.sprite.body.velocity.x * 0.8);
                }

                // Jumping
                if (onGround) this.jumpsLeft = this.maxJumps;

                const jumpPressed = Phaser.Input.Keyboard.JustDown(this.cursors.up) ||
                                  Phaser.Input.Keyboard.JustDown(this.keys.W) ||
                                  Phaser.Input.Keyboard.JustDown(this.keys.SPACE);

                if (jumpPressed && this.jumpsLeft > 0) {
                    this.sprite.body.setVelocityY(this.jumpPower);
                    this.jumpsLeft--;
                }

                // Shooting
                if (this.keys.K.isDown && this.scene.time.now - this.lastFired > this.fireRate) {
                    this.shoot();
                }

                // Grenades
                if (Phaser.Input.Keyboard.JustDown(this.keys.L) && this.grenadeCount > 0) {
                    this.throwGrenade();
                }

                // Visual
                this.sprite.setFillStyle(this.facing === 1 ? 0x0000FF : 0x0000AA);
            }

            shoot() {
                this.lastFired = this.scene.time.now;
                const gunX = this.sprite.x + (this.facing * 16);
                const gunY = this.sprite.y;

                const bullet = this.scene.add.rectangle(gunX, gunY, 8, 3, 0xFFFF00);
                this.scene.physics.add.existing(bullet);
                bullet.body.setAllowGravity(false);
                bullet.body.setVelocityX(this.facing * 600);
                bullet.isPlayerBullet = true;

                this.scene.time.delayedCall(2000, () => { if (bullet.active) bullet.destroy(); });
            }

            throwGrenade() {
                this.grenadeCount--;
                const grenadeX = this.sprite.x + (this.facing * 10);
                const grenadeY = this.sprite.y - 10;

                const grenade = this.scene.add.circle(grenadeX, grenadeY, 4, 0x00FF00);
                this.scene.physics.add.existing(grenade);
                grenade.body.setVelocity(this.facing * 200, -300);
                grenade.body.setBounce(0.6, 0.6);
                grenade.birthTime = this.scene.time.now;

                this.scene.grenades = this.scene.grenades || [];
                this.scene.grenades.push(grenade);
            }

            takeDamage(amount) {
                this.health -= amount;
                this.health = Math.max(0, this.health);
                this.sprite.setTint(0xFF0000);
                this.scene.time.delayedCall(200, () => this.sprite.clearTint());
            }
        }

        // Main Game Scene
        class MainScene extends Phaser.Scene {
            constructor() {
                super({ key: 'MainScene' });
            }

            create() {
                console.log('Scene created!');

                // Create ground
                this.ground = this.add.rectangle(640, 650, 2560, 100, 0x8B4513);
                this.physics.add.existing(this.ground, true);

                // Create some platforms
                this.platforms = this.physics.add.staticGroup();
                this.platforms.create(200, 500, null).setSize(128, 32).setDisplaySize(128, 32).refreshBody();
                this.platforms.getChildren().forEach(p => p.setFillStyle(0x654321));

                // Create player
                this.player = new Player(this, 100, 100);

                // Collisions
                this.physics.add.collider(this.player.sprite, this.ground);
                this.physics.add.collider(this.player.sprite, this.platforms);

                // Camera
                this.cameras.main.startFollow(this.player.sprite, true, 0.1, 0.1);
                this.cameras.main.setBounds(0, 0, 2560, 720);
                this.physics.world.setBounds(0, 0, 2560, 720);

                // UI
                this.healthText = this.add.text(20, 20, 'HP: 100', {
                    fontSize: '18px',
                    color: '#fff',
                    stroke: '#000',
                    strokeThickness: 4
                }).setScrollFactor(0).setDepth(1000);

                this.scoreText = this.add.text(20, 45, 'SCORE: 0', {
                    fontSize: '18px',
                    color: '#ff0',
                    stroke: '#000',
                    strokeThickness: 4
                }).setScrollFactor(0).setDepth(1000);

                this.controlsText = this.add.text(1260, 20,
                    'A/D - Move\nW/Space - Jump\nK/Click - Shoot\nL - Grenade',
                    {
                        fontSize: '14px',
                        color: '#fff',
                        stroke: '#000',
                        strokeThickness: 3,
                        align: 'right'
                    }
                ).setOrigin(1, 0).setScrollFactor(0).setDepth(1000);

                this.grenades = [];

                console.log('Scene setup complete!');
            }

            update() {
                this.player.update();

                // Update UI
                this.healthText.setText(`HP: ${this.player.health}`);
                this.scoreText.setText(`SCORE: ${window.gameState.score} | GRENADES: ${this.player.grenadeCount}`);

                // Update grenades
                if (this.grenades) {
                    this.grenades.forEach((grenade, index) => {
                        if (!grenade.active) return;

                        const timeAlive = this.time.now - grenade.birthTime;

                        // Flash
                        if (Math.floor(timeAlive / 100) % 2 === 0) {
                            grenade.setFillStyle(0xFF0000);
                        } else {
                            grenade.setFillStyle(0x00FF00);
                        }

                        // Explode after 2 seconds
                        if (timeAlive > 2000) {
                            this.explode(grenade.x, grenade.y);
                            grenade.destroy();
                            this.grenades.splice(index, 1);
                        }
                    });
                }
            }

            explode(x, y) {
                // Explosion visual
                const explosion = this.add.circle(x, y, 5, 0xFF4500);
                this.tweens.add({
                    targets: explosion,
                    radius: 100,
                    alpha: 0,
                    duration: 300,
                    onComplete: () => explosion.destroy()
                });

                // Particles
                for (let i = 0; i < 15; i++) {
                    const angle = (Math.PI * 2 * i) / 15;
                    const particle = this.add.circle(x, y, 3, 0xFF6600);
                    this.tweens.add({
                        targets: particle,
                        x: x + Math.cos(angle) * 100,
                        y: y + Math.sin(angle) * 100,
                        alpha: 0,
                        duration: 500,
                        onComplete: () => particle.destroy()
                    });
                }

                // Camera shake
                this.cameras.main.shake(200, 0.01);

                window.gameState.score += 100;
            }
        }

        // Game configuration
        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            backgroundColor: '#87CEEB',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 800 },
                    debug: false
                }
            },
            scene: [MainScene]
        };

        // Initialize the game
        console.log('Creating game...');
        const game = new Phaser.Game(config);
        console.log('Game created successfully!');
    </script>
</body>
</html>
